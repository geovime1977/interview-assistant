<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de Respostas</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --borda:#2a2f3a; --txt:#e8eaf0; --sub:#9aa3b2; --azul:#4f8cff; --verde:#2fbf71; --amar:#e6b450; --verm:#e5484d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:12px 20px; border-bottom:1px solid var(--borda); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header a { color:var(--azul); font-size:13px; }
  .layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 52px); }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; height:auto; } nav { max-height:260px; } }
  nav { border-right:1px solid var(--borda); overflow-y:auto; padding:10px; }
  nav h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); margin:14px 6px 6px; }
  nav button { display:block; width:100%; text-align:left; background:none; color:var(--txt); border:0; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:14px; }
  nav button:hover { background:#20242d; }
  nav button.ativo { background:#243150; }
  nav button .ok { color:var(--verde); float:right; }
  main { overflow-y:auto; padding:20px 26px; }
  .pergunta-en { font-size:26px; line-height:1.3; margin:4px 0; }
  .pergunta-pt { color:var(--sub); font-size:15px; margin-bottom:14px; }
  .barra { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  button.b { background:var(--azul); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.sec { background:#2a2f3a; }
  button.verm { background:var(--verm); }
  .bloco { background:var(--card); border:1px solid var(--borda); border-radius:10px; padding:14px 16px; margin:12px 0; }
  .resposta { font-size:19px; line-height:1.55; white-space:pre-wrap; }
  .resposta.oculta { filter:blur(7px); user-select:none; cursor:pointer; }
  .ref-pt { color:var(--sub); font-size:14px; margin-top:8px; }
  .cuidado { border-left:3px solid var(--amar); padding:6px 10px; color:#f0d9a6; font-size:14px; }
  table { border-collapse:collapse; font-size:14px; }
  td { padding:4px 12px 4px 0; vertical-align:top; }
  td:first-child { font-weight:600; }
  .pontos span { display:inline-block; padding:3px 8px; margin:3px; border-radius:12px; background:#2a2f3a; font-size:13px; }
  .pontos span.sim { background:#1f4d33; color:#bff0d2; }
  .pontos span.nao { background:#4d1f22; color:#f6c6c8; }
  #fala { font-size:16px; line-height:1.5; color:#cfd6e4; min-height:24px; }
  #avaliacao { white-space:pre-wrap; font-size:15px; line-height:1.5; }
  .aviso { color:var(--sub); font-size:12px; }
  .cartao { background:#10203a; border:1px solid #2f4f86; border-radius:10px; padding:12px 16px; margin:12px 0;
            font-family:ui-monospace,Menlo,monospace; font-size:15px; line-height:1.6; }
  .cartao b { color:#8fb4ff; }
</style>
</head>
<body>
<header>
  <h1>Banco de Respostas · Compass UOL</h1>
  <a href="/simulado">🎯 Simulado</a>
  <a href="/casos">Casos</a>
  <span class="aviso">Material de estudo: treine até saber de cor. Não é para ler durante a entrevista.</span>
  <span style="margin-left:auto"></span>
  <button class="b sec" id="btn-sortear">🎲 Sortear pergunta</button>
  <a href="/tradutor">Tradutor</a>
  <a href="/">Simulador</a>
</header>
<div class="layout">
  <nav id="menu"></nav>
  <main id="conteudo"><p class="aviso">Carregando…</p></main>
</div>
<script>
let DADOS = null, atual = null, rec = null, gravando = false, falaFinal = '';
const treinados = new Set(JSON.parse(localStorage.getItem('treinados') || '[]'));
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function falar(texto, lang = 'en-US') {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = lang; u.rate = 0.9;
  const voz = speechSynthesis.getVoices().find(v => v.lang === lang && /Samantha|Google US|Alex|Daniel/.test(v.name))
           || speechSynthesis.getVoices().find(v => v.lang === lang);
  if (voz) u.voice = voz;
  speechSynthesis.speak(u);
}

function esc(s) { return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function montarMenu() {
  const nav = document.getElementById('menu'); nav.innerHTML = '';
  for (const g of DADOS.grupos) {
    const h = document.createElement('h3'); h.textContent = g; nav.appendChild(h);
    for (const it of DADOS.itens.filter(i => i.grupo === g)) {
      const b = document.createElement('button');
      b.innerHTML = esc(it.titulo) + (treinados.has(it.id) ? '<span class="ok">✓</span>' : '');
      b.className = atual && atual.id === it.id ? 'ativo' : '';
      b.onclick = () => mostrar(it);
      nav.appendChild(b);
    }
  }
}

function mostrar(it) {
  atual = it; falaFinal = ''; montarMenu();
  const pt = it.lingua === 'pt';
  const resp = pt ? it.resposta_pt : it.resposta_en;
  const temResp = !!resp;
  const ehPergunta = it.grupo.startsWith('Perguntas');
  let h = `<div class="aviso">${esc(it.grupo)}</div>`;
  if (it.pergunta_en) h += `<div class="pergunta-en">${esc(it.pergunta_en)}</div>`;
  if (it.pergunta_pt) h += `<div class="pergunta-pt" style="${it.pergunta_en ? '' : 'font-size:22px;color:var(--txt)'}">${esc(it.pergunta_pt)}</div>`;
  h += '<div class="barra">';
  if (it.pergunta_en) h += `<button class="b sec" onclick="falar(atual.pergunta_en)">🔊 Ouvir em inglês</button>`;
  if (pt) h += `<button class="b sec" onclick="falar(atual.pergunta_pt, 'pt-BR')">🔊 Ouvir a pergunta</button>`;
  if (temResp) h += `<button class="b sec" id="btn-mostrar">👁 Mostrar resposta</button>
                     <button class="b sec" onclick="falar(${pt ? "atual.resposta_pt, 'pt-BR'" : 'atual.resposta_en'})">🔊 Ouvir a resposta</button>
                     <button class="b sec" onclick="speechSynthesis.cancel()">⏹</button>`;
  h += '</div>';
  if ((it.cartao || []).length) {
    h += `<div class="cartao">${it.cartao.map(l => { const k = l.indexOf(':');
      return k > 0 ? `<b>${esc(l.slice(0, k + 1))}</b>${esc(l.slice(k + 1))}` : esc(l); }).join('<br>')}</div>`;
  }
  if (temResp && pt) {
    h += `<div class="bloco"><div class="resposta oculta" id="resp">${esc(resp)}</div></div>`;
  } else if (temResp) {
    h += `<div class="bloco"><div class="resposta oculta" id="resp">${esc(it.resposta_en)}</div>
          <div class="ref-pt"><b>Referência em português:</b> ${esc(it.resposta_pt)}</div></div>`;
  } else if (it.resposta_pt) {
    h += `<div class="bloco ref-pt">${esc(it.resposta_pt)}</div>`;
  }
  if (it.cuidado) h += `<div class="cuidado">⚠️ ${esc(it.cuidado)}</div>`;
  const pal = Object.entries(it.palavras || {});
  if (pal.length) h += `<div class="bloco"><b>Pronúncia</b><table>${pal.map(([p, f]) =>
      `<tr><td><a href="#" onclick="falar('${p.replace(/'/g, "\\'")}');return false" style="color:var(--azul)">🔊 ${esc(p)}</a></td><td>${esc(f)}</td></tr>`).join('')}</table></div>`;
  if (temResp && !ehPergunta) {
    h += `<div class="bloco"><b>Treinar</b> — responda em voz alta, ${pt ? 'em português, olhando só o cartão (~60 s)' : 'em inglês, sem olhar a resposta'}.
          <div class="barra"><button class="b" id="btn-gravar">🎙️ Começar a responder</button>
          <button class="b sec" id="btn-avaliar" disabled>🧑‍🏫 Pedir avaliação</button></div>
          <div id="fala"></div>
          <div class="pontos" id="pontos">${(it.pontos || []).map(p => `<span>${esc(p)}</span>`).join('')}</div>
          <div class="aviso">Os pontos ficam verdes quando aparecem na sua fala.</div>
          <div id="avaliacao" style="margin-top:10px"></div></div>`;
  }
  document.getElementById('conteudo').innerHTML = h;
  const r = document.getElementById('resp');
  const bm = document.getElementById('btn-mostrar');
  if (bm) bm.onclick = () => r.classList.toggle('oculta');
  if (r) r.onclick = () => r.classList.remove('oculta');
  const bg = document.getElementById('btn-gravar');
  if (bg) bg.onclick = alternarGravacao;
  const ba = document.getElementById('btn-avaliar');
  if (ba) ba.onclick = pedirAvaliacao;
}

function conferirPontos(texto) {
  const t = texto.toLowerCase();
  document.querySelectorAll('#pontos span').forEach(s => {
    const p = s.textContent.toLowerCase();
    const palavras = p.split(/\s+/).filter(w => w.length > 3);
    const achou = t.includes(p) || (palavras.length && palavras.filter(w => t.includes(w)).length / palavras.length >= 0.6);
    s.className = achou ? 'sim' : (texto ? 'nao' : '');
  });
}

function alternarGravacao() {
  const bg = document.getElementById('btn-gravar');
  if (!SR) { document.getElementById('fala').textContent = 'Reconhecimento de voz indisponível: use o Chrome.'; return; }
  if (gravando) { rec.stop(); return; }
  rec = new SR(); rec.lang = atual.lingua === 'pt' ? 'pt-BR' : 'en-US'; rec.continuous = true; rec.interimResults = true;
  falaFinal = '';
  rec.onresult = (e) => {
    let fin = '', parc = '';
    for (let i = 0; i < e.results.length; i++) { const x = e.results[i][0].transcript; if (e.results[i].isFinal) fin += x + ' '; else parc += x; }
    falaFinal = fin; document.getElementById('fala').textContent = fin + parc; conferirPontos(fin + parc);
  };
  rec.onend = () => {
    gravando = false; bg.textContent = '🎙️ Responder de novo'; bg.classList.remove('verm');
    document.getElementById('btn-avaliar').disabled = !falaFinal.trim();
    if (falaFinal.trim()) { treinados.add(atual.id); localStorage.setItem('treinados', JSON.stringify([...treinados])); montarMenu(); }
  };
  rec.start(); gravando = true; bg.textContent = '⏹ Terminei'; bg.classList.add('verm');
  document.getElementById('avaliacao').textContent = '';
}

async function pedirAvaliacao() {
  const out = document.getElementById('avaliacao');
  out.textContent = 'Avaliando…';
  const r = await fetch('/avaliar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: atual.id, fala: falaFinal }) });
  const leitor = r.body.getReader(); const dec = new TextDecoder(); let buf = '', total = '';
  while (true) {
    const { value, done } = await leitor.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    const partes = buf.split('\n\n'); buf = partes.pop();
    for (const p of partes) {
      if (!p.startsWith('data: ')) continue;
      const d = p.slice(6); if (d === '[DONE]') return;
      const j = JSON.parse(d);
      if (j.error) { out.textContent = 'Erro: ' + j.error; return; }
      total += j.text || ''; out.textContent = total.replace(/\*\*/g, '');
    }
  }
}

document.getElementById('btn-sortear').onclick = () => {
  const pool = DADOS.itens.filter(i => i.resposta_en || (i.lingua === 'pt' && i.resposta_pt));
  const novos = pool.filter(i => !treinados.has(i.id));
  const lista = novos.length ? novos : pool;
  mostrar(lista[Math.floor(Math.random() * lista.length)]);
  setTimeout(() => atual.lingua === 'pt' ? falar(atual.pergunta_pt, 'pt-BR') : falar(atual.pergunta_en), 300);
};

speechSynthesis.onvoiceschanged = () => {};
fetch('/api/banco').then(r => r.json()).then(d => { DADOS = d; montarMenu(); mostrar(d.itens[0]); });
</script>
</body>
</html>
