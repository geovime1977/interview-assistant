<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casos Técnicos</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#181b22; --borda:#2a2f3a; --txt:#e8eaf0; --sub:#9aa3b2; --azul:#4f8cff; --verde:#2fbf71; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:12px 20px; border-bottom:1px solid var(--borda); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header a { color:var(--azul); font-size:13px; }
  .abas { display:flex; gap:6px; padding:10px 20px; flex-wrap:wrap; border-bottom:1px solid var(--borda); }
  .abas button { background:#20242d; color:var(--txt); border:1px solid var(--borda); border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; }
  .abas button.ativo { background:#243150; border-color:var(--azul); }
  main { max-width:1100px; margin:0 auto; padding:18px 22px 60px; }
  .bloco { background:var(--card); border:1px solid var(--borda); border-radius:10px; padding:14px 18px; margin:14px 0; }
  .md { line-height:1.55; font-size:15px; }
  .md table { border-collapse:collapse; margin:8px 0; }
  .md td, .md th { border:1px solid var(--borda); padding:4px 8px; }
  .md code { background:#0b0d11; padding:1px 4px; border-radius:4px; }
  .md pre { background:#0b0d11; padding:10px; border-radius:8px; overflow-x:auto; }
  .md blockquote { border-left:3px solid var(--azul); margin:8px 0; padding:2px 12px; color:#cfd6e4; }
  textarea { width:100%; min-height:200px; background:#0b0d11; color:var(--txt); border:1px solid var(--borda); border-radius:8px; padding:10px; font-size:15px; font-family:inherit; }
  button.b { background:var(--azul); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; margin:4px 6px 4px 0; }
  button.sec { background:#2a2f3a; }
  pre.saida { background:#0b0d11; border:1px solid var(--borda); border-radius:8px; padding:10px; white-space:pre-wrap; font-size:13px; max-height:420px; overflow:auto; }
  .oculto { display:none; }
  .aviso { color:var(--sub); font-size:13px; }
  #avaliacao { white-space:pre-wrap; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>Casos Técnicos · Compass UOL</h1>
  <span class="aviso">Leia o enunciado, escreva a sua resposta como falaria à banca, depois confira o gabarito e rode o código.</span>
  <span style="margin-left:auto"></span>
  <a href="/banco">Banco de respostas</a><a href="/tradutor">Tradutor</a>
</header>
<div class="abas" id="abas"></div>
<main id="main"><p class="aviso">Carregando…</p></main>
<script>
let CASOS = [], atual = null;
const chave = n => 'resposta_caso_' + n;
function salvar() { try { localStorage.setItem(chave(atual.n), document.getElementById('resp').value); } catch (e) {} }
function lido(n) { try { return localStorage.getItem(chave(n)) || ''; } catch (e) { return ''; } }

function abas() {
  const d = document.getElementById('abas'); d.innerHTML = '';
  for (const c of CASOS) {
    const b = document.createElement('button');
    b.textContent = `${c.n}. ${c.titulo}` + (lido(c.n).trim() ? ' ✓' : '');
    b.className = atual && atual.n === c.n ? 'ativo' : '';
    b.onclick = () => mostrar(c); d.appendChild(b);
  }
}

function mostrar(c) {
  atual = c; abas();
  const m = document.getElementById('main');
  m.innerHTML = `
    <div class="bloco md">${marked.parse(c.enunciado)}</div>
    <div class="bloco"><b>Sua resposta</b> <span class="aviso">(fica salva neste navegador)</span>
      <textarea id="resp" placeholder="Escreva como falaria à banca: decisões, objetivo, restrições, dados, como validar...">${lido(c.n).replace(/</g,'&lt;')}</textarea>
      <button class="b" id="btn-avaliar">🧑‍⚖️ Avaliar como a banca</button>
      <button class="b sec" id="btn-gab">👁 Mostrar gabarito</button>
      <div id="avaliacao" style="margin-top:10px"></div>
    </div>
    <div class="bloco"><b>Rodar o código do caso</b><div id="acoes"></div><pre class="saida oculto" id="saida"></pre></div>
    <div class="bloco md oculto" id="gabarito">${marked.parse(c.gabarito || '_sem gabarito_')}</div>`;
  document.getElementById('resp').oninput = salvar;
  document.getElementById('btn-gab').onclick = () => {
    const g = document.getElementById('gabarito'); g.classList.toggle('oculto');
    if (!g.classList.contains('oculto')) g.scrollIntoView({ behavior:'smooth' });
  };
  document.getElementById('btn-avaliar').onclick = avaliar;
  const ac = document.getElementById('acoes');
  c.acoes.forEach((rot, i) => {
    const b = document.createElement('button'); b.className = 'b sec'; b.textContent = '▶ ' + rot;
    b.onclick = () => rodar(i); ac.appendChild(b);
  });
}

async function rodar(i) {
  const s = document.getElementById('saida'); s.classList.remove('oculto'); s.textContent = 'Rodando…';
  const r = await fetch('/rodar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ caso: atual.n, acao: i }) });
  s.textContent = (await r.json()).saida;
}

async function avaliar() {
  const out = document.getElementById('avaliacao');
  const resposta = document.getElementById('resp').value.trim();
  if (!resposta) { out.textContent = 'Escreva a sua resposta antes.'; return; }
  out.textContent = 'A banca está lendo…';
  const r = await fetch('/avaliar-caso', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ caso: atual.n, resposta }) });
  const leitor = r.body.getReader(); const dec = new TextDecoder(); let buf = '', total = '';
  while (true) {
    const { value, done } = await leitor.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    const partes = buf.split('\n\n'); buf = partes.pop();
    for (const p of partes) {
      if (!p.startsWith('data: ')) continue;
      const d = p.slice(6); if (d === '[DONE]') return;
      const j = JSON.parse(d);
      if (j.error) { out.textContent = 'Erro: ' + j.error; return; }
      total += j.text || ''; out.textContent = total.replace(/\*\*/g, '');
    }
  }
}

fetch('/api/casos').then(r => r.json()).then(d => { CASOS = d; mostrar(d[0]); });
</script>
</body>
</html>
